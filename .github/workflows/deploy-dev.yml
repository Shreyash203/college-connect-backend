name: Build and Deploy Backend (dev)

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPOSITORY: ghcr.io/shreyash203/college-connect-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:dev
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Container App registry
        run: |
          az containerapp registry set \
            -n ca-college-connect-api \
            -g rg-college-connect-dev \
            --server ghcr.io \
            --username Shreyash203 \
            --password ${{ secrets.GHCR_PAT }}

      - name: Deploy new image
        run: |
          az containerapp update \
            -n ca-college-connect-api \
            -g rg-college-connect-dev \
            --image $IMAGE_REPOSITORY:${{ github.sha }}